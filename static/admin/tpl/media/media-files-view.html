<div class="shifu-media-view-switch">
    <button type="button"
            class="secondary"
            data-shifu-media-view="list"
            title="{{ i18n .Data.Lang "media_files_view_list" }}">
        <img src="{{ config.UI.Path }}/static/icons/list.svg" alt="{{ i18n .Data.Lang "media_files_view_list" }}" />
    </button>
    <button type="button"
            class="secondary"
            data-shifu-media-view="tiles"
            title="{{ i18n .Data.Lang "media_files_view_tiles" }}">
        <img src="{{ config.UI.Path }}/static/icons/tiles.svg" alt="{{ i18n .Data.Lang "media_files_view_tiles" }}" />
    </button>
</div>
